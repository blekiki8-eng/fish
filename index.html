<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.card{
  margin:10px;
  padding:15px;
  background:#1e293b;
  border-radius:10px;
}
button{
  margin-top:10px;
  padding:10px;
}
</style>
</head>

<body>

<h3 style="text-align:center">🐟 Fish Cash</h3>
<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API = "https://YOUR-RAILWAY-URL";

const userId = tg.initDataUnsafe?.user?.id || "test";

let fc = 0;
let gc = 0;

async function load(){
  let res = await fetch(API + "/user", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id:userId})
  });

  let data = await res.json();

  fc = data.fc;
  gc = data.gc;

  profile();
}

function profile(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      👤 ID: ${userId}<br><br>
      💰 FC: ${fc}<br>
      💎 GC: ${gc}<br><br>

      <button onclick="fishing()">🎣 Fishing</button>
    </div>
  `;
}

function fishing(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>🎣 Fishing</h3>

      <input id="bet" type="number" value="10"><br><br>

      <select id="cur">
        <option value="fc">FC</option>
        <option value="gc">GC</option>
      </select><br><br>

      <button onclick="go()">Fish</button>
      <button onclick="profile()">Back</button>
    </div>
  `;
}

async function go(){
  let bet = +document.getElementById("bet").value;
  let cur = document.getElementById("cur").value;

  let res = await fetch(API + "/fish", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      id:userId,
      bet,
      currency:cur
    })
  });

  let data = await res.json();

  if(data.error){
    alert("Not enough money");
    return;
  }

  fc = data.fc;
  gc = data.gc;

  alert(data.result + (data.win ? " WIN x1.5" : " LOSE"));

  profile();
}

load();
</script>

</body>
</html>
