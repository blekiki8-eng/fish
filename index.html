<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.header {
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

.card {
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

button {
  margin-top:10px;
  padding:10px;
}
</style>
</head>

<body>

<div class="header">🐟 Fish Cash</div>
<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const API = "https://YOUR-RAILWAY-URL";

const userId = tg.initDataUnsafe?.user?.id || "test";

let fc = 0;
let gc = 0;

// LOAD USER
async function loadUser(){
  let res = await fetch(API + "/user", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id:userId})
  });

  let data = await res.json();
  fc = data.fc;
  gc = data.gc;

  profile();
}

// PROFILE
function profile(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>👤 Profile</h3>
      ID: ${userId}<br><br>
      💰 FC: ${fc}<br>
      💎 GC: ${gc}<br><br>

      <button onclick="fishing()">🎣 Fishing</button>
      <button onclick="donate()">💰 Donate</button>
    </div>
  `;
}

// FISHING
function fishing(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>🎣 Fishing</h3>

      <input id="bet" type="number" value="10"><br><br>

      <select id="cur">
        <option value="fc">Fish Coin</option>
        <option value="gc">Gold Coin</option>
      </select><br><br>

      <button onclick="go()">Fish</button>
      <button onclick="profile()">Back</button>
    </div>
  `;
}

// GAME
async function go(){
  let bet = +document.getElementById("bet").value;
  let cur = document.getElementById("cur").value;

  let res = await fetch(API + "/fish", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      id:userId,
      bet,
      currency:cur
    })
  });

  let data = await res.json();

  if(data.error){
    alert("Not enough money");
    return;
  }

  fc = data.fc;
  gc = data.gc;

  alert(data.result + (data.win ? " WIN x1.5" : " LOSE"));

  profile();
}

// DONATE
function donate(){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h3>💰 Donate</h3>
      Soon...
      <button onclick="profile()">Back</button>
    </div>
  `;
}

loadUser();
</script>

</body>
</html>
