<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.header {
  text-align: center;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 20px;
  padding-bottom: 80px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
}

.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #1e293b;
}

.nav button {
  flex: 1;
  padding: 15px;
  border: none;
  background: none;
  color: white;
  font-size: 14px;
}

.nav button.active {
  background: #334155;
}
</style>
</head>

<body>

<div class="header">🐟 Fish Cash</div>

<div class="container" id="app"></div>

<div class="nav">
  <button id="btnProfile" onclick="profile()">Profile</button>
  <button id="btnFishing" onclick="fishing()">Fishing</button>
  <button id="btnDonate" onclick="donate()">Donate</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function setActive(id){
  document.querySelectorAll(".nav button")
    .forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// PROFILE
function profile(){
  setActive("btnProfile");

  document.getElementById("app").innerHTML = `
    <div class="card">
      👤 Profile<br><br>
      Тут буде профіль
    </div>
  `;
}

// FISHING
function fishing(){
  setActive("btnFishing");

  document.getElementById("app").innerHTML = `
    <div class="card">
      🎣 Fishing<br><br>
      Тут буде рибалка
    </div>
  `;
}

// DONATE
function donate(){
  setActive("btnDonate");

  document.getElementById("app").innerHTML = `
    <div class="card">
      💰 Donate<br><br>
      Тут буде донат
    </div>
  `;
}

// старт
profile();
</script>

</body>
</html>
